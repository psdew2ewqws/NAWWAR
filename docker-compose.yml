version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings.prod
      - PORT=8000
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nawwar_db
      - POSTGRES_USER=nawwar
      - POSTGRES_PASSWORD=nawwar_prod_2024
    ports:
      - "5433:5432"

volumes:
  postgres_data:
